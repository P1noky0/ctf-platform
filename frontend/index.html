<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTF Platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>CTF Platform</h1>
        <p>Learn. Hack. Capture the Flag.</p>
        <p>Score: <span id="scoreDisplay">0</span></p>
    </header>

    <main>
    <section class="hero">
        <h2>Welcome to the CTF Platform</h2>

        <p>
            Practice cybersecurity through hands-on challenges.
        </p>

        <button id="startButton">
            View Challenges
        </button>
    </section>

    <section id="challenges">
        <h2>Challenges</h2>

        <div id="challengeFilters">
            <button data-category="All">All</button>
            <button data-category="Web">Web</button>
            <button data-category="Cryptography">Cryptography</button>
            <button data-category="Forensics">Forensics</button>
        </div>
        
        <div id="challengeList"></div>
    </section>

    <section id="challengeDetails">
        <h2>Challenge Details</h2>

        <div id="challengeDetailsContent">
            <p>Select a challenge to view its details.</p>
        </div>
    </section>

    <section id="challengeWorkspace">
        <h2>Challenge Workspace</h2>

        <div id="challengeWorkspaceContent">
            <p>Select and start a challenge to begin.</p>
        </div>
    </section>
</main>

    <script type="module"src="js/app.js"></script>
</body>
</html>
